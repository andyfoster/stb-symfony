# Settings shared by both environments. Every kamal command needs a destination, which adds
# its own file and secrets on top of this one:
#   -d test        config/deploy.test.yml, .kamal/secrets.test (stb.gitforked.com)
#   -d production  config/deploy.production.yml, .kamal/secrets.production (scarfietextbooks.com)
# Both run on the same server. Each sets its own service and image name, so containers,
# the database accessory (<service>-db) and the photo volume (<service>_uploads) stay apart.

# Deploy to these servers.
servers:
  web:
    hosts:
      - 89.167.96.7
    # Listing photos (PhotoStorage, UPLOAD_DIR): options.volume is set per destination.
  # Messenger worker: sends queued emails (async transport) and runs scheduled jobs
  # (scheduler_default, see src/Schedule.php). It exits after an hour or 128M and Kamal's
  # restart policy starts it again. No proxy: only "web" serves HTTP.
  job:
    hosts:
      - 89.167.96.7
    cmd: php bin/console messenger:consume async scheduler_default --time-limit=3600 --memory-limit=128M
    options:
      # The FrankenPHP base image's HEALTHCHECK curls Caddy, which the worker doesn't run.
      no-healthcheck: true

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Remove this section when using multiple web servers and ensure you terminate SSL at your load balancer.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
# How long a new container has to answer /up before the deploy gives up. It
# runs pending migrations first (bin/docker-entrypoint), so allow for slow ones.
deploy_timeout: 120

proxy:
  ssl: true
  # hosts: set per destination.
  # Proxy connects to your container on port 80 by default.
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

# Credentials for your image host.
registry:
  server: localhost:5555
  # Specify the registry server, if you're not using Docker Hub
  # server: registry.digitalocean.com / ghcr.io / ...
  # username: my-user

  # Always use an access token rather than real password (pulled from .kamal/secrets).
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Configure builder setup.
builder:
  arch: amd64
  # Pass in additional build args needed for your Dockerfile.
  # args:
  #   RUBY_VERSION: <%= ENV["RBENV_VERSION"] || ENV["rvm_ruby_string"] || "#{RUBY_ENGINE}-#{RUBY_ENGINE_VERSION}" %>

# Inject ENV variables into containers (secrets come from .kamal/secrets).
#
env:
  clear:
    APP_ENV: prod
    # DEFAULT_URI (the link host for emails the job role sends) is set per destination.
    MAILER_FROM: ScarfieTextbooks <noreply@scarfietextbooks.com>
    # Where the contact form on /about sends messages.
    CONTACT_EMAIL: andy@andyfoster.net
    # File locks must live on the same volume in web and worker containers.
    LOCK_DSN: flock:///app/var/uploads/.locks
#     DB_HOST: 192.168.0.2
  secret:
    - APP_SECRET
    - DATABASE_URL
    - MAILER_DSN
    # Cloudflare Turnstile. The site key is public, but lives next to its secret.
    - TURNSTILE_SITE_KEY
    - TURNSTILE_SECRET_KEY
    # "Continue with Google" (config/packages/knpu_oauth2_client.yaml).
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal app logs -r job" will tail logs from the first server in the job section.
#
aliases:
  # --roles=web so commands run once, not also in the job (worker) container.
  console: app exec --roles=web --interactive --reuse "php bin/console"
  shell: app exec --roles=web --interactive --reuse "bash"

# Use a different ssh user than root
#
# ssh:
#   user: app

# Use a persistent storage volume.
#
# volumes:
#   - "app_storage:/app/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
#
# asset_path: /app/public/assets

# Configure rolling deploys by setting a wait time between batches of restarts.
#
# boot:
#   limit: 10 # Can also specify as a percentage of total hosts, such as "25%"
#   wait: 2

# Use accessory services (secrets come from .kamal/secrets).
#
accessories:
  db:
    image: postgres:18
    host: 89.167.96.7
    network: kamal

    env:
      # clear: POSTGRES_USER and POSTGRES_DB are set per destination.
      secret:
        - POSTGRES_PASSWORD
#     files:
#       - config/mysql/production.cnf:/etc/mysql/my.cnf
#       - db/production.sql:/docker-entrypoint-initdb.d/setup.sql
    # directories: set per destination.
