security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        # Accounts imported from the old site have unsalted SHA-1 hashes; they
        # still sign in, and get a modern hash on their first login.
        legacy_sha1:
            id: App\Security\LegacySha1PasswordHasher
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto
            migrate_from: [legacy_sha1]

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # No "property": UserRepository::loadUserByIdentifier() finds users by
        # case-insensitive email. Social and magic-link logins can reuse it.
        app_user_provider:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            # "Continue with Google" (GoogleController starts it). A magic-link
            # login_link could sit alongside these.
            custom_authenticators:
                - App\Security\GoogleAuthenticator
            # The firewall's entry point (where signed-out visitors are sent) stays the login page.
            entry_point: form_login
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: app_listings
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 days
                # Changing the password signs out remembered devices.
                signature_properties: [password]
            # 5 failed attempts per email+IP per minute (needs symfony/rate-limiter).
            login_throttling:
                max_attempts: 5
            logout:
                path: app_logout
                target: app_listings
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
                migrate_from: [legacy_sha1]
