knpu_oauth2_client:
    clients:
        # "Continue with Google" (App\Security\GoogleAuthenticator). The buttons only show
        # when GOOGLE_CLIENT_ID is set; the redirect URI to register with Google is
        # https://<host>/connect/google/check.
        google:
            type: google
            client_id: '%env(GOOGLE_CLIENT_ID)%'
            client_secret: '%env(GOOGLE_CLIENT_SECRET)%'
            redirect_route: app_google_check
        # The same Google client, coming back to a different place: confirming a new email
        # or password on an account without a password (GoogleController::confirm()).
        # Register https://<host>/account/google/check with Google too.
        google_confirm:
            type: google
            client_id: '%env(GOOGLE_CLIENT_ID)%'
            client_secret: '%env(GOOGLE_CLIENT_SECRET)%'
            redirect_route: app_account_google_check
