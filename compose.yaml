# Local development services. PHP runs on the host (`symfony serve`); only
# backing services run in Docker. Production uses Kamal (config/deploy.yml).
name: scarfietextbooks

services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: scarfietextbooks
      POSTGRES_USER: scarfietextbooks
      POSTGRES_PASSWORD: scarfietextbooks
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "scarfietextbooks", "-U", "scarfietextbooks"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      # Fixed host port so DATABASE_URL in .env works without the Symfony CLI.
      - "5441:5432"
    volumes:
      - postgres:/var/lib/postgresql

volumes:
  postgres:
