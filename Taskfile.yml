# ScarfieTextbooks. Run `task` to list everything.
#
# PHP runs on this machine through the Symfony CLI (`symfony serve`, `symfony console`).
# Postgres and Mailpit run in Docker (compose.yaml, compose.override.yaml).
# Production is deployed with Kamal (config/deploy.yml).
version: '3'

vars:
  URL: https://127.0.0.1:8000
  # The production server (config/deploy.yml: servers, and Kamal's default ssh user, root).
  PROD_SSH: root@89.167.96.7
  BACKUPS: var/backups

tasks:
  default:
    desc: List all commands
    silent: true
    cmds:
      - task --list

  # --- Everyday ------------------------------------------------------------

  setup:
    desc: 'First-time setup: install dependencies, start Docker, migrate and load example data'
    cmds:
      - composer install --no-interaction
      - task: db:start
      - task: migrate
      - symfony console messenger:setup-transports --no-interaction
      - task: db:seed

  start:
    desc: Start Docker services, the web server and email worker, apply pending migrations
    cmds:
      - task: db:start
      - task: migrate
      - symfony serve -d
      - echo "ScarfieTextbooks is running at {{.URL}}"

  stop:
    desc: Stop the web server and Docker services (data is kept)
    cmds:
      - symfony server:stop
      - docker compose stop

  status:
    desc: Show web server and Docker container status
    cmds:
      - symfony server:status
      - docker compose ps

  open:
    desc: Open the site in your browser
    cmds:
      - symfony open:local

  logs:
    desc: Follow web server and application logs
    cmds:
      - symfony server:log

  mail:
    desc: Open Mailpit to see emails the app has sent
    cmds:
      - symfony open:local:webmail

  # --- Symfony and Composer ------------------------------------------------

  console:
    desc: 'Run a Symfony console command (task console -- debug:router)'
    cmds:
      - symfony console {{.CLI_ARGS}}

  composer:
    desc: 'Run Composer (task composer -- require symfony/lock)'
    cmds:
      - symfony composer {{.CLI_ARGS}}

  routes:
    desc: List all routes
    cmds:
      - symfony console debug:router

  cache:clear:
    desc: Clear the dev cache
    cmds:
      - symfony console cache:clear

  assets:install:
    desc: Download importmap packages and install bundle assets
    cmds:
      - symfony console importmap:install
      - symfony console assets:install public

  # --- Quality -------------------------------------------------------------

  test:
    desc: 'Run the test suite (task test -- --filter ListingControllerTest)'
    cmds:
      - php bin/phpunit {{.CLI_ARGS}}

  lint:
    desc: Validate the container, Twig templates, YAML config and Doctrine mapping
    cmds:
      - docker compose config --quiet
      - symfony console lint:container
      - symfony console lint:twig templates/
      - symfony console lint:yaml config/
      - symfony console doctrine:schema:validate --skip-sync

  check:
    desc: Run lint and tests (do this before committing)
    cmds:
      - task: lint
      - task: test

  # --- Database (Postgres in Docker) ---------------------------------------

  db:start:
    desc: Start Postgres and Mailpit in Docker and wait until they are ready
    cmds:
      - docker compose up -d --wait --wait-timeout 120

  db:stop:
    desc: Stop the Docker services (data is kept)
    cmds:
      - docker compose stop

  db:shell:
    desc: Open psql in the Docker database
    interactive: true
    cmds:
      - docker compose exec database psql -U scarfietextbooks -d scarfietextbooks

  db:restore:
    desc: 'Replace the local database with a dump, e.g. from prod:db:dump (task db:restore -- var/backups/stb-….dump)'
    prompt: Replace everything in the local database with this dump?
    preconditions:
      - sh: test -f "{{.CLI_ARGS}}"
        msg: 'Pass the dump file: task db:restore -- var/backups/stb-20261019-0900.dump'
    cmds:
      - docker compose exec -T database pg_restore -U scarfietextbooks -d scarfietextbooks --clean --if-exists --no-owner --no-privileges < "{{.CLI_ARGS}}"
      - echo "Restored {{.CLI_ARGS}}. Production users' passwords work locally too; reset them with task user:reset-password if needed."

  db:seed:
    desc: Replace all data with the example listings and their stand-in photos (src/DataFixtures)
    cmds:
      - rm -rf var/uploads
      - symfony console doctrine:fixtures:load --no-interaction

  db:reset:
    desc: Drop and recreate the database, run migrations and load example data
    prompt: This deletes all local data in the scarfietextbooks database. Continue?
    cmds:
      - symfony console doctrine:database:drop --force --if-exists
      - symfony console doctrine:database:create
      - task: migrate
      - symfony console messenger:setup-transports --no-interaction
      - task: db:seed

  db:validate:
    desc: Check Doctrine mapping matches the database schema
    cmds:
      - symfony console doctrine:schema:validate

  db:destroy:
    desc: Remove the Docker containers and the database volume
    prompt: This permanently deletes the local Docker database volume. Continue?
    cmds:
      - docker compose down --volumes

  # --- Migrations ----------------------------------------------------------

  migrate:
    desc: Apply pending database migrations
    cmds:
      - symfony console doctrine:migrations:migrate --no-interaction --allow-no-migration

  migrate:make:
    desc: Generate a migration after changing entities (review it before running)
    cmds:
      - symfony console make:migration --no-interaction

  migrate:status:
    desc: Show migration status
    cmds:
      - symfony console doctrine:migrations:status

  migrate:dry-run:
    desc: Preview the SQL of pending migrations without running it
    cmds:
      - symfony console doctrine:migrations:migrate --dry-run --no-interaction

  # --- Background jobs (Messenger) -----------------------------------------
  # `symfony serve` already runs a worker (.symfony.local.yaml); this one is for watching it work.

  worker:
    desc: 'Process queued messages in the foreground with verbose output (Ctrl+C to stop)'
    cmds:
      - symfony console messenger:consume async scheduler_default -vv {{.CLI_ARGS}}

  reminders:send:
    desc: Email sellers whose listings expire soon now, instead of waiting for the daily schedule
    cmds:
      - symfony console app:listings:send-expiry-reminders

  worker:failed:
    desc: Show messages that failed processing
    cmds:
      - symfony console messenger:failed:show {{.CLI_ARGS}}

  photos:regenerate:
    desc: 'Remake listing photo sizes (task photos:regenerate -- --missing, --size=thumb, --queue)'
    cmds:
      - symfony console app:photos:regenerate {{.CLI_ARGS}}

  photos:prune:
    desc: Delete photo files that no photo in the database uses any more
    cmds:
      - symfony console app:photos:prune

  papers:import:
    desc: 'Load Otago papers from a code,title CSV (default data/otago-papers.csv; task papers:import -- file.csv)'
    cmds:
      - symfony console app:papers:import {{.CLI_ARGS}}

  user:reset-password:
    desc: 'Reset an account''s password to Password1! (task user:reset-password -- sam@example.com; --password=... for another)'
    cmds:
      - symfony console app:user:reset-password {{.CLI_ARGS}}

  user:promote:
    desc: 'Make an account an admin (task user:promote -- sam@example.com; add --demote to undo)'
    cmds:
      - symfony console app:user:promote {{.CLI_ARGS}}

  # --- Production (Kamal, stb.gitforked.com) -------------------------------
  # .kamal/secrets fetches APP_SECRET, POSTGRES_PASSWORD, MAILER_DSN (Mailgun) and the
  # Cloudflare Turnstile keys (TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY) from
  # 1Password (account my.1password.ca, item Private/ScarfieTextbooks-production).
  # config/deploy.yml has two roles: web, and job (the Messenger worker that sends emails).

  prod:env:
    internal: true
    preconditions:
      - sh: command -v op >/dev/null
        msg: 'Install the 1Password CLI first: brew install 1password-cli'
      - sh: op item get ScarfieTextbooks-production --vault Private --account my.1password.ca --fields label=APP_SECRET,label=POSTGRES_PASSWORD,label=MAILER_DSN --reveal >/dev/null
        msg: 'Could not read APP_SECRET, POSTGRES_PASSWORD and MAILER_DSN from 1Password item Private/ScarfieTextbooks-production (account my.1password.ca). Is it created, and are you signed in?'

  prod:secrets:check:
    desc: Check Kamal can read the production secrets from 1Password (values are not shown)
    deps: [prod:env]
    cmds:
      - kamal secrets print | sed -E 's/=.+/=(set)/'

  prod:db:boot:
    desc: 'First time only: create and start the production Postgres (stb-db)'
    prompt: Start the stb-db Postgres accessory on the production server?
    deps: [prod:env]
    cmds:
      - kamal accessory boot db

  prod:db:status:
    desc: Show whether the production Postgres container is running
    cmds:
      - kamal accessory details db

  prod:db:shell:
    desc: Open psql on the production database (stb-db). Careful, it's live data.
    interactive: true
    cmds:
      - kamal accessory exec db --interactive --reuse "psql -U stb -d stb"

  prod:db:logs:
    desc: Follow the production Postgres (stb-db) logs
    cmds:
      - kamal accessory logs db -f

  prod:db:dump:
    desc: 'Download a backup of the production database to var/backups (pg_dump custom format; restore with pg_restore or task db:restore)'
    vars:
      FILE: '{{.BACKUPS}}/stb-{{now | date "20060102-1504"}}.dump'
    cmds:
      - mkdir -p {{.BACKUPS}}
      # Straight from docker over ssh: kamal's own output would end up in the file.
      - ssh {{.PROD_SSH}} "docker exec stb-db pg_dump -U stb -d stb --format=custom" > {{.FILE}}
      - test -s {{.FILE}}
      - echo "Saved {{.FILE}} ($(du -h {{.FILE}} | cut -f1))"

  prod:uploads:backup:
    desc: Download the production listing photos (the stb_uploads volume) to var/backups
    vars:
      FILE: '{{.BACKUPS}}/stb-uploads-{{now | date "20060102-1504"}}.tar.gz'
    cmds:
      - mkdir -p {{.BACKUPS}}
      - ssh {{.PROD_SSH}} "tar -C /var/lib/docker/volumes/stb_uploads/_data -cz ." > {{.FILE}}
      - echo "Saved {{.FILE}} ($(du -h {{.FILE}} | cut -f1))"

  deploy:
    desc: Build and deploy to production with Kamal
    prompt: Deploy the current code to stb.gitforked.com?
    deps: [prod:env]
    cmds:
      - kamal deploy

  prod:migrate:
    desc: Run pending migrations in production
    prompt: Run migrations against the production database?
    deps: [prod:env]
    cmds:
      - kamal console doctrine:migrations:migrate --no-interaction

  prod:messenger:setup:
    desc: 'Make sure the Messenger queue table exists in production (auto_setup=0; migrations create it, safe to rerun)'
    prompt: Create any missing Messenger tables in the production database?
    deps: [prod:env]
    cmds:
      - kamal console messenger:setup-transports --no-interaction

  prod:worker:logs:
    desc: Follow the production Messenger worker (email sending) logs
    cmds:
      - kamal app logs -f --roles=job

  prod:worker:failed:
    desc: Show messages (e.g. emails) that failed in production
    cmds:
      - kamal console messenger:failed:show

  prod:logs:
    desc: Follow production web app logs
    cmds:
      - kamal app logs -f --roles=web

  prod:console:
    desc: 'Run a Symfony console command in production (task prod:console -- about)'
    cmds:
      - kamal console {{.CLI_ARGS}}

  prod:photos:regenerate:
    desc: 'Remake production photo sizes on the worker (task prod:photos:regenerate -- --missing)'
    deps: [prod:env]
    cmds:
      - kamal console app:photos:regenerate --queue {{.CLI_ARGS}}

  prod:photos:prune:
    desc: Delete production photo files that no photo in the database uses any more
    prompt: Delete unused photo files on the production server?
    deps: [prod:env]
    cmds:
      - kamal console app:photos:prune

  prod:papers:import:
    desc: 'Load the Otago paper list in production (data/otago-papers.csv, shipped in the image)'
    deps: [prod:env]
    cmds:
      - kamal console app:papers:import

  prod:user:reset-password:
    desc: 'Reset a production account''s password to Password1! (task prod:user:reset-password -- them@example.com)'
    deps: [prod:env]
    cmds:
      - kamal console app:user:reset-password {{.CLI_ARGS}}

  prod:user:promote:
    desc: 'Make a production account an admin (task prod:user:promote -- you@example.com)'
    deps: [prod:env]
    cmds:
      - kamal console app:user:promote {{.CLI_ARGS}}

  prod:shell:
    desc: Open a shell in the production app container
    interactive: true
    cmds:
      - kamal shell
