# ScarfieTextbooks. Run `task` to list everything.
#
# PHP runs on this machine through the Symfony CLI (`symfony serve`, `symfony console`).
# Postgres and Mailpit run in Docker (compose.yaml, compose.override.yaml).
# Production (scarfietextbooks.com) and test (stb.gitforked.com) are deployed with Kamal
# destinations: config/deploy.yml plus deploy.production.yml or deploy.test.yml.
version: '3'

# The deployed environments (Kamal destinations), both on SERVER_SSH, with the same tasks
# from taskfiles/server.yml: task prod:deploy, task test:db:dump, ...
includes:
  prod:
    taskfile: ./taskfiles/server.yml
    dir: .
    vars:
      NS: prod
      DEST: production
      SERVICE: scarfietextbooks
      ITEM: ScarfieTextbooks-production
      SITE: scarfietextbooks.com
  test:
    taskfile: ./taskfiles/server.yml
    dir: .
    vars:
      NS: test
      DEST: test
      SERVICE: stb
      ITEM: ScarfieTextbooks-test
      SITE: stb.gitforked.com

vars:
  URL: https://127.0.0.1:8000
  # The server both deployed environments run on (config/deploy.yml: servers, and Kamal's
  # default ssh user, root).
  SERVER_SSH: root@89.167.96.7
  BACKUPS: var/backups

tasks:
  default:
    desc: List all commands
    silent: true
    cmds:
      - task --list

  # --- Everyday ------------------------------------------------------------

  setup:
    desc: 'First-time setup: install dependencies, start Docker, migrate and load example data'
    cmds:
      - composer install --no-interaction
      - task: db:start
      - task: migrate
      - symfony console messenger:setup-transports --no-interaction
      - task: db:seed

  start:
    desc: Start Docker services, the web server and email worker, apply pending migrations
    cmds:
      - task: db:start
      - task: migrate
      - symfony serve -d
      - echo "ScarfieTextbooks is running at {{.URL}}"

  stop:
    desc: Stop the web server and Docker services (data is kept)
    cmds:
      - symfony server:stop
      - docker compose stop

  restart:
    desc: Stop and start everything again
    cmds:
      - task: stop
      - task: start

  status:
    desc: Show web server and Docker container status
    cmds:
      - symfony server:status
      - docker compose ps

  open:
    desc: Open the site in your browser
    cmds:
      - symfony open:local

  logs:
    desc: Follow web server and application logs
    cmds:
      - symfony server:log

  mail:
    desc: Open Mailpit to see emails the app has sent
    cmds:
      - symfony open:local:webmail

  # --- Symfony and Composer ------------------------------------------------

  console:
    desc: 'Run a Symfony console command (task console -- debug:router)'
    cmds:
      - symfony console {{.CLI_ARGS}}

  composer:
    desc: 'Run Composer (task composer -- require symfony/lock)'
    cmds:
      - symfony composer {{.CLI_ARGS}}

  routes:
    desc: List all routes
    cmds:
      - symfony console debug:router

  cache:clear:
    desc: Clear the dev cache
    cmds:
      - symfony console cache:clear

  assets:install:
    desc: Download importmap packages and install bundle assets
    cmds:
      - symfony console importmap:install
      - symfony console assets:install public

  # --- Quality -------------------------------------------------------------

  phpstan:
    desc: Run PHPStan static analysis (task phpstan -- --level=7)
    cmds:
      - symfony php vendor/bin/phpstan analyse --memory-limit=1G {{.CLI_ARGS}}

  rector:
    desc: 'Preview Rector refactorings without changing files (task rector -- src/Controller)'
    cmds:
      - symfony php vendor/bin/rector process --dry-run {{.CLI_ARGS}}

  rector:fix:
    desc: 'Apply Rector refactorings (task rector:fix -- src/Controller)'
    cmds:
      - symfony php vendor/bin/rector process {{.CLI_ARGS}}

  test:
    desc: 'Run the test suite (task test -- --filter ListingControllerTest)'
    cmds:
      - php bin/phpunit {{.CLI_ARGS}}

  lint:
    desc: Validate the container, Twig templates, YAML config and Doctrine mapping
    cmds:
      - docker compose config --quiet
      - symfony console lint:container
      - symfony console lint:twig templates/
      - symfony console lint:yaml config/
      - symfony console doctrine:schema:validate --skip-sync

  check:
    desc: Run lint and tests (do this before committing)
    cmds:
      - task: lint
      - task: test

  # --- Database (Postgres in Docker) ---------------------------------------

  db:start:
    desc: Start Postgres and Mailpit in Docker and wait until they are ready
    cmds:
      - docker compose up -d --wait --wait-timeout 120

  db:stop:
    desc: Stop the Docker services (data is kept)
    cmds:
      - docker compose stop

  db:shell:
    desc: Open psql in the Docker database
    interactive: true
    cmds:
      - docker compose exec database psql -U scarfietextbooks -d scarfietextbooks

  db:pull:
    desc: Pull newer Postgres and Mailpit images (task restart to use them)
    cmds:
      - docker compose pull

  db:dump:
    desc: 'Save a backup of the local database to var/backups (restore with task db:restore)'
    vars:
      FILE: '{{.BACKUPS}}/local-{{now | date "20060102-1504"}}.dump'
    cmds:
      - mkdir -p {{.BACKUPS}}
      - docker compose exec -T database pg_dump -U scarfietextbooks -d scarfietextbooks --format=custom > {{.FILE}}
      - test -s {{.FILE}}
      - echo "Saved {{.FILE}} ($(du -h {{.FILE}} | cut -f1))"

  db:restore:
    desc: 'Replace the local database with a dump, e.g. from prod:db:dump (task db:restore -- var/backups/stb-….dump)'
    prompt: Replace everything in the local database with this dump?
    preconditions:
      - sh: test -f "{{.CLI_ARGS}}"
        msg: 'Pass the dump file: task db:restore -- var/backups/stb-20261019-0900.dump'
    cmds:
      - docker compose exec -T database pg_restore -U scarfietextbooks -d scarfietextbooks --clean --if-exists --no-owner --no-privileges < "{{.CLI_ARGS}}"
      - echo "Restored {{.CLI_ARGS}}. Production users' passwords work locally too; reset them with task user:reset-password if needed."

  db:seed:
    desc: 'Replace all local data with example sellers, listings, stand-in photos and messages (app:seed; log in as sam@example.com / password)'
    cmds:
      - symfony console app:seed --force {{.CLI_ARGS}}

  db:reset:
    desc: Drop and recreate the database, run migrations and load example data
    prompt: This deletes all local data in the scarfietextbooks database. Continue?
    cmds:
      - symfony console doctrine:database:drop --force --if-exists
      - symfony console doctrine:database:create
      - task: migrate
      - symfony console messenger:setup-transports --no-interaction
      - task: db:seed

  db:clear:
    desc: 'Delete all local data and photos, reload the paper list and create admin user #1 (admin@scarfietextbooks.com / password; --email=, --password= to change)'
    prompt: This deletes every user, listing, message and photo in the local database. Continue?
    cmds:
      - symfony console app:database:clear --force {{.CLI_ARGS}}

  db:validate:
    desc: Check Doctrine mapping matches the database schema
    cmds:
      - symfony console doctrine:schema:validate

  db:destroy:
    desc: Remove the Docker containers and the database volume
    prompt: This permanently deletes the local Docker database volume. Continue?
    cmds:
      - docker compose down --volumes

  # --- Migrations ----------------------------------------------------------

  migrate:
    desc: Apply pending database migrations
    cmds:
      - symfony console doctrine:migrations:migrate --no-interaction --allow-no-migration

  migrate:make:
    desc: Generate a migration after changing entities (review it before running)
    cmds:
      - symfony console make:migration --no-interaction

  migrate:status:
    desc: Show migration status
    cmds:
      - symfony console doctrine:migrations:status

  migrate:dry-run:
    desc: Preview the SQL of pending migrations without running it
    cmds:
      - symfony console doctrine:migrations:migrate --dry-run --no-interaction

  # --- Background jobs (Messenger) -----------------------------------------
  # `symfony serve` already runs a worker (.symfony.local.yaml); this one is for watching it work.

  worker:
    desc: 'Process queued messages in the foreground with verbose output (Ctrl+C to stop)'
    cmds:
      - symfony console messenger:consume async scheduler_default -vv {{.CLI_ARGS}}

  mail:test:
    desc: 'Send a real email through Mailgun with the test key (task mail:test -- you@example.com)'
    dotenv: ['.env.local']
    preconditions:
      - sh: test -n "$MAILER_TEST_DSN"
        msg: 'Add MAILER_TEST_DSN to .env.local: a Mailgun DSN with the test key, like mailgun+api://KEY:DOMAIN@default?region=us'
    cmds:
      # Plain php, not `symfony console`, which would swap in Mailpit's DSN.
      - MAILER_DSN="$MAILER_TEST_DSN" php bin/console mailer:test {{.CLI_ARGS}} --from="${MAILER_FROM:-ScarfieTextbooks <noreply@scarfietextbooks.com>}" --subject="ScarfieTextbooks test email" --body="Mailgun is set up."

  reminders:send:
    desc: Email sellers whose listings expire soon now, instead of waiting for the daily schedule
    cmds:
      - symfony console app:listings:send-expiry-reminders

  worker:failed:
    desc: Show messages that failed processing
    cmds:
      - symfony console messenger:failed:show {{.CLI_ARGS}}

  photos:regenerate:
    desc: 'Remake listing photo sizes (task photos:regenerate -- --missing, --size=thumb, --queue)'
    cmds:
      - symfony console app:photos:regenerate {{.CLI_ARGS}}

  photos:prune:
    desc: Delete photo files that no photo in the database uses any more
    cmds:
      - symfony console app:photos:prune

  papers:import:
    desc: 'Load Otago papers from a "CODE; Title" or code,title file (default data/otago-papers.csv; task papers:import -- file.csv)'
    cmds:
      - symfony console app:papers:import {{.CLI_ARGS}}

  legacy:import:
    desc: 'Import the old site''s current listings, their sellers and the Book list from its MariaDB dump, safe to rerun (task legacy:import -- dump.sql; --dry-run to try it)'
    cmds:
      - symfony console app:legacy:import {{.CLI_ARGS}}

  user:reset-password:
    desc: 'Reset an account''s password to Password1! (task user:reset-password -- sam@example.com; --password=... for another)'
    cmds:
      - symfony console app:user:reset-password {{.CLI_ARGS}}

  ip:unblock:
    desc: 'Unblock an IP address or range (task ip:unblock -- 203.0.113.7), e.g. if you blocked your own'
    cmds:
      - symfony console app:ip:unblock {{.CLI_ARGS}}

  user:promote:
    desc: 'Make an account an admin (task user:promote -- sam@example.com; add --demote to undo)'
    cmds:
      - symfony console app:user:promote {{.CLI_ARGS}}
