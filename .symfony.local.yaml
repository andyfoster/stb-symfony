# Symfony CLI local server config: `symfony serve` (and `task start`) also runs these.
workers:
    # Sends queued emails to Mailpit and runs scheduled jobs (src/Schedule.php).
    # Restarts when code or config changes.
    messenger_consume_async:
        cmd: ['symfony', 'console', 'messenger:consume', 'async', 'scheduler_default']
        watch: ['config', 'src', 'templates', 'vendor']
